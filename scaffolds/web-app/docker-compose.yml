# {{project_name}} — generated by Poiesis from the web-app archetype.
#
# This file is scaffolding, not feature code. It is rendered deterministically
# before any agent writes a line, so the application boots on day one and the
# Developer's job is to fill named slots rather than invent a topology.
#
# The standard topology, the same for every generated application:
#
#   frontend (gateway)  the UI, and /api routed to backend, or to data when backend is down
#   backend  (api)      story endpoints + the generic data API          app.main
#   data                the generic data API only, no story code        app.data_main
#   db                  Postgres, seeded from db/init.sql
#
# The gateway waits for the database and the data service, not for the api: a
# story module that breaks the api can no longer keep the whole application from
# starting. Every service restarts on failure.
#
# It contains no host bind mounts on purpose. Poiesis starts it through the
# Docker socket from inside its own container, where host paths do not exist;
# everything a service needs is built into its image.

name: {{project_slug}}

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      APP_NAME: "{{project_name}}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python, not curl: the slim image has no curl and adding one to every
      # generated app is a cost the healthcheck does not need to pay. 127.0.0.1,
      # not localhost: localhost can resolve to ::1, where nothing listens.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "8000"

  data:
    build: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.data_main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      APP_NAME: "{{project_name}}"
      POIESIS_SERVICE: data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      data:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      # Poiesis sets APP_PORT per deployment so several apps can run at once, and
      # binds to 127.0.0.1 unless told otherwise: this is unauthenticated,
      # model-written code, and it stays off the network until access control exists.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:80"
    healthcheck:
      # Through the proxy, so "healthy" means the browser can actually reach the API.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
