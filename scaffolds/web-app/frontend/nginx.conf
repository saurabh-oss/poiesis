# The gateway: serves the UI and routes /api. Written by Poiesis, and read-only.
#
# Two rules keep the application reachable whatever one service is doing:
#
#  1. Upstreams are resolved per request through Docker's DNS, not once at start.
#     nginx refuses to start at all when a proxy_pass host does not resolve, so a
#     crashed api container used to take the UI down with it.
#  2. When the api service is down, starting, or answering 502/503/504, the same
#     request goes to the data service, which serves every table through the
#     generic data API and contains no story code.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        # $http_host keeps the port; $host drops it, so a FastAPI trailing-slash
        # redirect would send the browser to port 80 instead of the app's port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @data;
    }

    location @data {
        set $data_upstream http://data:8000;
        proxy_pass $data_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Served-By data;
        add_header X-Served-By data always;
    }

    location = /health {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @data;
    }

    # Revalidate on every load. Each build round redeploys new screens at the same
    # URLs; a heuristically cached screens/index.js would show last round's app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
