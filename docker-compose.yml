name: poiesis

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poiesis
      POSTGRES_PASSWORD: poiesis
      POSTGRES_DB: poiesis
    volumes: [ "./data/postgres:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poiesis"]
      interval: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  neo4j:
    restart: unless-stopped
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/poiesisdev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - ./data/neo4j:/data
    ports: [ "7474:7474", "7687:7687" ]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 30

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:latest
    volumes: [ "./data/qdrant:/qdrant/storage" ]
    ports: [ "6333:6333" ]

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: poiesis
      MINIO_ROOT_PASSWORD: poiesisdev
    volumes: [ "./data/minio:/data" ]
    ports: [ "9000:9000", "9001:9001" ]

  # ---- observability ---------------------------------------------------------
  # Traces: every stage, model call, sandbox run and deploy, as spans.
  jaeger:
    restart: unless-stopped
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP, what the orchestrator exports to
    environment:
      LOG_LEVEL: warn

  # Metrics: model calls, tokens, durations, gates, runs.
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports: [ "9090:9090" ]

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: poiesis
      GF_SECURITY_ADMIN_PASSWORD: poiesisdev
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports: [ "3030:3000" ]
    depends_on: [ prometheus ]

  orchestrator:
    restart: unless-stopped
    build: ./services/orchestrator
    env_file: .env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    volumes:
      - ./workspaces:/workspaces
      - ./packs:/app/packs:ro
      - ./scaffolds:/app/scaffolds:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports: [ "8080:8080" ]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      retries: 20
      start_period: 30s

  indexer:
    build: ./services/indexer
    env_file: .env
    depends_on:
      neo4j: { condition: service_healthy }
    volumes:
      - ./services/indexer/portfolio.yaml:/app/portfolio.yaml:ro
      - ./data/repos:/repos
    profiles: [ "tools" ]

  ui:
    restart: unless-stopped
    build: ./services/ui
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    depends_on: [ orchestrator ]
    ports: [ "3000:3000" ]
