server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API. The browser calls /api/... on this host and nginx forwards
    # to the backend service, so the generated app never needs CORS or a
    # hard-coded backend URL baked in at build time.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        # $http_host keeps the port; $host drops it, so a FastAPI trailing-slash
        # redirect would send the browser to port 80 instead of the app's port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Revalidate on every load. Each build round redeploys new screens at the same
    # URLs; a heuristically cached screens/index.js would show last round's app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
