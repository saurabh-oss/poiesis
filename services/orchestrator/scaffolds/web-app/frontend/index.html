<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{project_name}}</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark">·</span>
        <span>{{project_name}}</span>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <span id="status" class="status" data-state="checking">checking API…</span>
      </div>
    </aside>

    <div class="content">
      <header class="page-head">
        <div>
          <h1 id="page-title">{{project_name}}</h1>
          <p id="page-subtitle" hidden></p>
        </div>
        <div class="page-actions" id="page-actions"></div>
      </header>

      <!-- The shell (app.js) renders the story screens from frontend/screens/ here. -->
      <main id="app" aria-live="polite">
        <p class="muted">Loading…</p>
      </main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
